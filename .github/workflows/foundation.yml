name: Foundation quality

on:
  pull_request:
    branches: [agent-dev, dev, main]
  push:
    branches: [agent-dev]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: make bootstrap
      - run: make check
      - name: Verify committed locks are current
        run: |
          make lock
          git diff --exit-code -- requirements.lock requirements-build.lock requirements-dev.lock

  container:
    name: Canonical container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make container-check
